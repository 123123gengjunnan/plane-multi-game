<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>飞机暴冲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0e14;color:#fff;font-family:-apple-system,PingFang SC,Microsoft YaHei,sans-serif;touch-action:none;}
.nick-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#nickInput{padding:10px 14px;font-size:18px;width:220px;}
#enterBtn{padding:10px 20px;font-size:18px;cursor:pointer;}
#wrap{display:none;}
</style>
</head>
<body>
<div class="nick-wrap" id="nickArea">
    <input type="text" id="nickInput" placeholder="输入昵称">
    <button id="enterBtn">进入游戏房间</button>
</div>
<div id="wrap">
    游戏主画面
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io({transports: ['polling', 'websocket']});
const nickInput = document.getElementById('nickInput');
const enterBtn = document.getElementById('enterBtn');
const nickArea = document.getElementById('nickArea');
const wrap = document.getElementById('wrap');

enterBtn.onclick = function(){
    const name = nickInput.value.trim();
    if(!name) return;
    socket.emit('join', name);
    nickArea.style.display = 'none';
    wrap.style.display = 'block';
}
</script>
</body>
</html>
