<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>飞机暴冲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0e14;color:#fff;font-family:-apple-system,PingFang SC,Microsoft YaHei,sans-serif;touch-action:none;}
.nick-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#nickInput{padding:10px 14px;font-size:18px;width:220px;}
#enterBtn{padding:10px 20px;font-size:18px;cursor:pointer;}
#wrap{display:none;width:100%;height:100%;padding:30px;text-align:center;}
#multi{font-size:80px;margin:30px 0;color:#4ade80;}
#timer{font-size:24px;margin-bottom:20px;}
.bet-area{margin-top:40px;}
#betInput{width:160px;padding:8px;font-size:18px;}
#betBtn{padding:8px 16px;font-size:18px;cursor:pointer;margin-left:8px;}
.player-list{
    position: fixed;
    top:20px;
    left:20px;
    text-align:left;
    background:rgba(255,255,255,0.08);
    padding:12px;
    border-radius:8px;
    min-width:180px;
}
.player-list h4{margin-bottom:8px;}
.player-row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;}
.bet-amount{color:#fbbf24;}
.cashed{color:#4ade80;}
</style>
</head>
<body>
<div class="nick-wrap" id="nickArea">
    <input type="text" id="nickInput" placeholder="输入昵称">
    <button id="enterBtn">进入游戏房间</button>
</div>
<div id="wrap">
    <div class="player-list">
        <h4>在线玩家</h4>
        <div id="playerBox"></div>
    </div>

    <div id="multi">1.00x</div>
    <div id="timer">等待开局</div>
    <div class="bet-area">
        <input type="number" id="betInput" placeholder="下注金额" value="10">
        <button id="betBtn">下注</button>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io({transports: ['polling', 'websocket']});
const nickInput = document.getElementById('nickInput');
const enterBtn = document.getElementById('enterBtn');
const nickArea = document.getElementById('nickArea');
const wrap = document.getElementById('wrap');
const multiEl = document.getElementById('multi');
const timerEl = document.getElementById('timer');
const betInput = document.getElementById('betInput');
const betBtn = document.getElementById('betBtn');
const playerBox = document.getElementById('playerBox');

enterBtn.onclick = function(){
    const name = nickInput.value.trim();
    if(!name) return;
    socket.emit('join', name);
    nickArea.style.display = 'none';
    wrap.style.display = 'block';
}

socket.on('playerList', (list)=>{
    playerBox.innerHTML = list.map(p=>{
        let right;
        if(p.cashed) right = `<span class="cashed">已提现 ${p.cashed.toFixed(2)}x</span>`;
        else if(p.bet > 0) right = `<span class="bet-amount">下注 ${p.bet}</span>`;
        else right = `<span>未下注</span>`;
        return `<div class="player-row"><span>${p.name}</span>${right}</div>`;
    }).join('');
})
socket.on('multi', (val)=>{
    multiEl.innerText = val.toFixed(2)+'x';
})
socket.on('countdown', (sec)=>{
    timerEl.innerText = `距离起飞：${sec}s`;
})
socket.on('crash', ()=>{
    multiEl.style.color = '#f87171';
    timerEl.innerText = '爆炸！';
    setTimeout(()=>{
        multiEl.style.color = '#4ade80';
    },1200)
})
betBtn.onclick = ()=>{
    let val = Number(betInput.value);
    if(val>0) socket.emit('bet', val);
}
</script>
</body>
</html>
