<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>飞机暴富｜多人同局</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0e14;color:#fff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none}
#wrap{display:flex;height:100%;gap:8px;padding:8px}
#gameArea{flex:2;display:flex;flex-direction:column;gap:8px}
#playerPanel{flex:1;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;overflow-y:auto}
#playerPanel h3{margin-bottom:8px;font-size:16px}
.player-item{padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.05);margin-bottom:6px;font-size:13px}
#top{display:flex;align-items:center;gap:10px}
#history{flex:1;display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
#history::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.1);color:#cfd6e4}
.chip.low{color:#ff6b6b}
.chip.mid{color:#ffd43b}
.chip.high{color:#3bff9b}
#balance{flex:none;text-align:right;background:rgba(255,212,59,.12);border:1px solid rgba(255,212,59,.3);border-radius:12px;padding:6px 12px}
#balance .lab{font-size:10px;opacity:.7}
#balance .val{font-size:18px;font-weight:900;color:#ffd43b}
#stageBox{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#1a2436,#0d111a);border:1px solid rgba(255,255,255,.12)}
#game{display:block;width:100%;height:100%}
#stageCenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#bigMult{font-size:44px;font-weight:900;text-shadow:0 0 20px rgba(59,214,255,.5)}
#stageMsg{font-size:14px;opacity:.85;margin-top:6px}
#countdown{font-size:30px;font-weight:900;color:#ffd43b}
#crashLabel{font-size:30px;font-weight:900;color:#ff4747;display:none}
#ctrl{display:flex;flex-direction:column;gap:8px}
#betRow{display:flex;align-items:center;gap:8px}
.stepBtn{flex:none;width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);font-size:20px;font-weight:900;color:#fff}
#betAmt{flex:1;text-align:center;font-size:20px;font-weight:900;background:rgba(255,255,255,.06);border-radius:10px;padding:10px}
#actions{display:flex;gap:8px}
.act{flex:1;height:50px;border:none;border-radius:14px;font-size:16px;font-weight:900;color:#fff}
#confirmBet{background:linear-gradient(90deg,#3b82f6,#2563eb)}
#skipBet{background:rgba(255,255,255,.12)}
#cashout{background:linear-gradient(90deg,#3bff9b,#16a34a);display:none}
.nick-wrap{padding:10px}
#nickInput{padding:8px;width:220px;border-radius:8px;background:#222;border:1px solid #444;color:#fff;font-size:15px}
#setNickBtn{padding:8px 14px;border-radius:8px;background:#3b82f6;color:#fff;border:none}
</style>
</head>
<body>
<div class="nick-wrap" id="nickArea">
    <input id="nickInput" placeholder="输入你的昵称，加入房间">
    <button id="setNickBtn">进入游戏房间</button>
</div>

<div id="wrap" style="display:none">
    <div id="gameArea">
        <div id="top">
            <div id="history"></div>
            <div id="balance"><div class="lab">我的燃油</div><div class="val" id="fuelVal">100</div></div>
        </div>
        <div id="stageBox">
            <canvas id="game"></canvas>
            <div id="stageCenter">
                <div id="bigMult" style="display:none">×1.00</div>
                <div id="countdown">10</div>
                <div id="crashLabel">💥 坠毁!</div>
                <div id="stageMsg"></div>
            </div>
        </div>
        <div id="ctrl">
            <div id="betRow">
                <button class="stepBtn" id="minus">-</button>
                <div id="betAmt">10</div>
                <button class="stepBtn" id="plus">+</button>
            </div>
            <div id="actions">
                <button class="act" id="confirmBet">加油下注</button>
                <button class="act" id="skipBet">此局不加</button>
                <button class="act" id="cashout">取出燃油</button>
            </div>
        </div>
    </div>
    <div id="playerPanel">
        <h3>🏠房间在线玩家</h3>
        <div id="playerListDom"></div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io();
let myPlayerId = null;
let localPlayer = null;
let gameState = {phase:"betting",mult:1,countdown:10};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W=0,H=0;
function resize(){
  const r = canvas.getBoundingClientRect();
  W = canvas.width = r.width*devicePixelRatio;
  H = canvas.height = r.height*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener('resize',resize);

const Sound = {
  ctx: null,
  init(){
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
    }
    if(this.ctx.state==='suspended') this.ctx.resume();
  },
  tone(freq, dur, type='sine', vol=0.18, slideTo=null, delay=0){
    if(!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  },
  noise(dur=0.6, vol=0.3, freq=800){
    if(!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const len = this.ctx.sampleRate*dur;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
    const g = this.ctx.createGain(); g.gain.value=vol;
    src.connect(f); f.connect(g); g.connect(this.ctx.destination);
    src.start(t0);
  },
  bet(){ this.tone(220,0.15,'triangle',0.25,180); },
  takeoff(){ this.tone(200,0.7,'sawtooth',0.15,600); },
  cashout(){ this.tone(660,0.1,'square',0.15); this.tone(990,0.18,'square',0.15,null,0.1); },
  crash(){ this.noise(0.7,0.4,1200); this.tone(300,0.8,'sawtooth',0.25,60); }
};

const $ = id=>document.getElementById(id);
socket.on("connect",()=>{
    myPlayerId = socket.id;
})
socket.on("gameState",(gs)=>{
    gameState = gs;
    renderGameUI();
})
socket.on("playerList",(playersObj)=>{
    if(!playersObj[myPlayerId]) return;
    localPlayer = playersObj[myPlayerId];
    $("#fuelVal").textContent = localPlayer.fuel;
    $("#betAmt").textContent = localPlayer.bet;
    let html = "";
    for(let pid in playersObj){
        const p = playersObj[pid];
        html += `<div class="player-item">${p.nick}｜燃油:${p.fuel}｜下注:${p.lockedBet}</div>`
    }
    $("#playerListDom").innerHTML = html;
})
function renderGameUI(){
    $("#history").innerHTML = gameState.history.map(m=>{
        const cls = m<2?'low':m<5?'mid':'high';
        return `<span class="chip ${cls}">${m.toFixed(2)}×</span>`
    }).join('');
    if(gameState.phase === "betting"){
        $("#countdown").style.display='block';
        $("#bigMult").style.display='none';
        $("#crashLabel").style.display='none';
        $("#countdown").textContent = Math.max(0,Math.ceil(gameState.countdown));
        $("#confirmBet").style.display='flex';
        $("#skipBet").style.display='flex';
        $("#cashout").style.display='none';
        $("#stageMsg").textContent="等待飞机起飞";
    }else if(gameState.phase === "flying"){
        $("#countdown").style.display='none';
        $("#bigMult").style.display='block';
        $("#bigMult").textContent = "×"+gameState.mult.toFixed(2);
        $("#crashLabel").style.display='none';
        $("#confirmBet").style.display='none';
        $("#skipBet").style.display='none';
        $("#cashout").style.display='flex';
        $("#stageMsg").textContent="";
    }else if(gameState.phase === "crashed"){
        $("#bigMult").style.display='none';
        $("#crashLabel").style.display='block';
        $("#cashout").style.display='none';
    }
}
function planePos(){
    const k = Math.min(1,(gameState.mult-1)/8);
    return { x: W*(0.15+0.65*k), y: H*(0.8-0.55*k), k };
}
function drawPlane(x,y,angle,color,scale=1){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(angle); ctx.scale(scale,scale);
  if(gameState.phase==='flying'){
    ctx.fillStyle='rgba(255,168,59,.8)';
    ctx.beginPath();
    ctx.moveTo(-12,0); ctx.lineTo(-26-Math.random()*8,5); ctx.lineTo(-26-Math.random()*8,-5);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(22,0); ctx.lineTo(-10,10); ctx.lineTo(-4,0); ctx.lineTo(-10,-10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.beginPath();
  ctx.moveTo(2,0); ctx.lineTo(-4,18); ctx.lineTo(-10,18); ctx.lineTo(-6,0);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(2,0); ctx.lineTo(-4,-18); ctx.lineTo(-10,-18); ctx.lineTo(-6,0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#0d111a';
  ctx.beginPath(); ctx.arc(10,-2,3.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawExplosion(x,y){
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, d=Math.random()*40;
    ctx.fillStyle=`rgba(${255},${120+Math.random()*100|0},40,.9)`;
    ctx.beginPath();
    ctx.arc(x+Math.cos(a)*d, y+Math.sin(a)*d, 3+Math.random()*5, 0, Math.PI*2);
    ctx.fill();
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<24;i++){ ctx.fillRect((i*73)%W,(i*41)%H,2,2); }
  ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,H*0.85); ctx.lineTo(W,H*0.85); ctx.stroke();
  const p = planePos();
  if(gameState.phase==='betting'){
    drawPlane(W*0.15, H*0.8, -Math.PI/2*0.15, '#cfd6e4',1);
  } else if(gameState.phase==='flying'){
    ctx.strokeStyle='rgba(59,214,255,.6)'; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(W*0.15,H*0.8);
    ctx.quadraticCurveTo(W*0.4,H*0.65, p.x,p.y);
    ctx.stroke();
    const ang = -Math.PI/6 - p.k*0.2;
    drawPlane(p.x,p.y,ang,'#fff',1.1);
  } else if(gameState.phase==='crashed'){
    ctx.strokeStyle='rgba(255,71,71,.5)'; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(W*0.15,H*0.8);
    ctx.quadraticCurveTo(W*0.4,H*0.65, p.x,p.y);
    ctx.stroke();
    drawExplosion(p.x,p.y);
  }
  requestAnimationFrame(draw);
}

$("#setNickBtn").onclick = ()=>{
    const nick = $("#nickInput").value.trim();
    socket.emit("setNick", nick);
    $("#nickArea").style.display="none";
    $("#wrap").style.display="flex";
    resize();
    draw();
}
$("#minus").onclick=()=>{
    if(!localPlayer) return;
    Sound.init();
    const newVal = Math.max(5, localPlayer.bet-5);
    socket.emit("setBetAmt", newVal);
}
$("#plus").onclick=()=>{
    if(!localPlayer) return;
    Sound.init();
    const newVal = localPlayer.bet+5;
    socket.emit("setBetAmt", newVal);
}
$("#confirmBet").onclick=()=>{ Sound.init(); socket.emit("placeBet"); }
$("#skipBet").onclick=()=>{ socket.emit("skipBet"); }
$("#cashout").onclick=()=>{ Sound.init(); socket.emit("cashout"); }

resize();
draw();
</script>
</body>
</html>
